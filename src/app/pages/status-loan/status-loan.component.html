<div class="container mt-5">
    <h2 class="mb-4">Mis Préstamos</h2>
  
    <div *ngIf="loading" class="text-center">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>
  
    <div *ngIf="errorMsg" class="alert alert-danger">
      {{ errorMsg }}
    </div>
  
    <table *ngIf="!loading && loans.length" class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Monto</th>
          <th>Plazo (meses)</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let loan of loans">
          <td>{{ loan.id }}</td>
          <td>{{ loan.amount | currency:'USD':'symbol':'1.0-0' }}</td>
          <td>{{ loan.termMonths }}</td>
          <td>
            <span 
              [ngClass]="{
                'badge bg-warning': loan.status === 'PENDING',
                'badge bg-success': loan.status === 'APPROVED',
                'badge bg-danger':  loan.status === 'REJECTED'
              }"
            >
              {{ loan.status }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  
    <div *ngIf="!loading && !loans.length" class="alert alert-info">
      No tienes préstamos solicitados.
    </div>
  </div>
