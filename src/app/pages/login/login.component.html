<div class="container mt-5" style="max-width: 400px;">
    <h2 class="mb-4">Iniciar Sesión</h2>
    
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="username" class="form-label">Usuario</label>
        <input id="username" formControlName="username"
               class="form-control"
               [class.is-invalid]="form.get('username')?.invalid && form.get('username')?.touched">
        <div class="invalid-feedback">Usuario requerido</div>
      </div>
  
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input id="password" type="password" formControlName="password"
               class="form-control"
               [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched">
        <div class="invalid-feedback">Contraseña requerida</div>
      </div>
  
      <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>
  
      <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid">
        Entrar
      </button>
    </form>
  </div>
