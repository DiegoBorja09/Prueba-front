<div class="container mt-5" style="max-width: 500px;">
    <h2 class="mb-4">Solicitar un Préstamo</h2>
    <form [formGroup]="loanForm" (ngSubmit)="onSubmit()">
      <!-- Monto -->
      <div class="mb-3">
        <label for="amount" class="form-label">Monto</label>
        <input id="amount" type="number" formControlName="amount"
               class="form-control"
               [class.is-invalid]="loanForm.get('amount')?.invalid && loanForm.touched">
        <div class="invalid-feedback">
          Monto es requerido y debe ser mayor a 0.
        </div>
      </div>
  
      <!-- Plazo -->
      <div class="mb-3">
        <label for="termMonths" class="form-label">Plazo (meses)</label>
        <input id="termMonths" type="number" formControlName="termMonths"
               class="form-control"
               [class.is-invalid]="loanForm.get('termMonths')?.invalid && loanForm.touched">
        <div class="invalid-feedback">
          Plazo es requerido y debe ser al menos 1 mes.
        </div>
      </div>
  
      <button type="submit" class="btn btn-primary w-100">
        Solicitar
      </button>
    </form>
  
    <div *ngIf="errorMsg" class="alert alert-danger mt-3">{{ errorMsg }}</div>
    <div *ngIf="successMsg" class="alert alert-success mt-3">{{ successMsg }}</div>
  </div>
